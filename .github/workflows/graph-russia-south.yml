name: Build Graph — Russia South
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль'
        default: 'car'
        type: choice
        options: [car, bicycle, motorcycle]
jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Download Russia PBF
        run: |
          mkdir -p pbf_data
          curl -L --retry 5 --retry-delay 10 --max-time 1800 \
            -o pbf_data/russia-latest.osm.pbf \
            "https://download.geofabrik.de/russia-latest.osm.pbf" || \
          curl -L --retry 5 --max-time 1800 \
            -o pbf_data/russia-latest.osm.pbf \
            "http://download.openstreetmap.fr/extracts/russia-latest.osm.pbf"
      - name: Extract bbox
        run: |
          mkdir -p extracts
          osmium extract --bbox=35,41,50,52 --overwrite \
            -o extracts/russia_south.osm.pbf pbf_data/russia-latest.osm.pbf
      - name: Compile routing graph
        run: |
          mkdir -p graph_output scripts
          cat > scripts/compile_graph.dart << 'DART_SCRIPT'
          import 'dart:io';
          import 'package:geo_route_finder/geo_route_finder.dart';
          Future<void> main(List<String> args) async {
            final profile = switch (args[2]) {
              'bicycle' => VehicleProfile.bicycle,
              'motorcycle' => VehicleProfile.motorcycle,
              _ => VehicleProfile.car,
            };
            print('🔧 Компиляция: ${args[0]} → ${args[3]} (${args[1]}, ${args[2]})');
            final storage = LocalFileStorage(directory: args[3]);
            final converter = OsmConverter(
              profile: profile, compress: true,
              readSignals: false, readTurnRestrictions: false,
            );
            final sw = Stopwatch()..start();
            await converter.convert(inputFile: args[0], storage: storage, graphId: args[1]);
            sw.stop();
            print('✅ Граф скомпилирован за ${sw.elapsed.inSeconds} сек');
          }
          DART_SCRIPT
          cd scripts
          cat > pubspec.yaml << 'PUBSPEC'
          name: graph_compiler
          environment:
            sdk: ^3.5.0
          dependencies:
            geo_route_finder: ^1.1.0
          PUBSPEC
          dart pub get
          dart run compile_graph.dart \
            ../extracts/russia_south.osm.pbf russia_south \
            ${{ github.event.inputs.profile }} ../graph_output
      - name: Package artifacts
        run: |
          cd graph_output
          tar -czvf ../russia_south_routing_${{ github.event.inputs.profile }}.tar.gz \
            $(find . -name "*.graph" -o -name "*.index" -o -name "*.meta")
          cd .. && ls -lh *.tar.gz
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: routing-graphs-v1
          name: "Routing Graphs v1"
          body: |
            **Регион:** Юг (Краснодар, Ростов, Кавказ, Волгоград)
            **Bbox:** `35,41,50,52`
            **Профиль:** ${{ github.event.inputs.profile }}
          files: |
            russia_south_routing_${{ github.event.inputs.profile }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
