name: Build Routing Graphs (OSM PBF → GeoGraph)

on:
  workflow_dispatch:
    inputs:
      region_id:
        description: 'ID региона (например, russia_ural_center)'
        default: 'russia_ural_center'
        type: string
      bbox:
        description: 'Bbox: west_lon,south_lat,east_lon,north_lat'
        default: '43,54,62,62'
        type: string
      profile:
        description: 'Профиль маршрутизации'
        default: 'car'
        type: choice
        options:
          - car
          - bicycle
          - motorcycle

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download Russia PBF
        run: |
          mkdir -p pbf_data
          echo "📥 Скачиваем russia-latest.osm.pbf..."
          curl -L --retry 5 --retry-delay 10 \
            -o pbf_data/russia-latest.osm.pbf \
            "https://download.geofabrik.de/russia-latest.osm.pbf" || \
          curl -L --retry 5 \
            -o pbf_data/russia-latest.osm.pbf \
            "http://download.openstreetmap.fr/extracts/russia-latest.osm.pbf"
          ls -lh pbf_data/

      - name: Extract bbox
        run: |
          mkdir -p extracts
          osmium extract \
            --bbox=${{ github.event.inputs.bbox }} \
            --overwrite \
            -o extracts/${{ github.event.inputs.region_id }}.osm.pbf \
            pbf_data/russia-latest.osm.pbf
          ls -lh extracts/

      - name: Compile routing graph
        run: |
          mkdir -p graph_output scripts
          cat > scripts/compile_graph.dart << 'DART_SCRIPT'
          import 'dart:io';
          import 'package:geo_route_finder/geo_route_finder.dart';

          Future<void> main(List<String> args) async {
            final pbfPath = args[0];
            final regionId = args[1];
            final profileName = args[2];
            final outDir = args[3];

            final profile = switch (profileName) {
              'bicycle' => VehicleProfile.bicycle,
              'motorcycle' => VehicleProfile.motorcycle,
              _ => VehicleProfile.car,
            };

            print('🔧 Компиляция: $pbfPath → $outDir/$regionId ($profileName)');
            print('📦 geo_route_finder версия: $geoRouteFinderVersion');
            print('📐 Формат графа: v$kGraphFormatVersion');

            final storage = LocalFileStorage(directory: outDir);
            final converter = OsmConverter(
              profile: profile,
              compress: true,
              readSignals: true,
              readTurnRestrictions: true,
            );

            final sw = Stopwatch()..start();
            await converter.convert(
              inputFile: pbfPath,
              storage: storage,
              graphId: regionId,
            );
            sw.stop();
            print('✅ Граф скомпилирован за ${sw.elapsed.inSeconds} сек');

            // В версии 1.3.0 файлы называются <regionId>_<profile>.ext
            for (final ext in ['.graph', '.index', '.meta']) {
              final f = File('$outDir/${regionId}_${profileName}$ext');
              if (await f.exists()) {
                final size = await f.length();
                print('   📄 ${regionId}_${profileName}$ext: ${(size / 1024 / 1024).toStringAsFixed(2)} MB');
              }
            }
          }
          DART_SCRIPT

          cd scripts
          cat > pubspec.yaml << 'PUBSPEC'
          name: graph_compiler
          environment:
            sdk: ^3.5.0
          dependencies:
            geo_route_finder: ^1.3.0
          PUBSPEC
          dart pub get
          dart run compile_graph.dart \
            ../extracts/${{ github.event.inputs.region_id }}.osm.pbf \
            ${{ github.event.inputs.region_id }} \
            ${{ github.event.inputs.profile }} \
            ../graph_output

      - name: Package artifacts
        run: |
          echo "🔍 Структура graph_output:"
          find graph_output -type f | sort
          cd graph_output
          # 🆕 В 1.3.0 файлы уже называются <regionId>_<profile>.ext
          tar -czvf ../${{ github.event.inputs.region_id }}_routing_${{ github.event.inputs.profile }}.tar.gz \
            $(find . -name "*.graph" -o -name "*.index" -o -name "*.meta")
          cd ..
          ls -lh *.tar.gz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: routing-graphs-v1
          name: "Routing Graphs v1 (geo_route_finder 1.3.0)"
          body: |
            Скомпилированные графы дорог для офлайн-навигации.
            
            **⚠️ ВАЖНО:** Графы собраны с `geo_route_finder 1.3.0` (формат v4).
            Несовместимы с приложениями на `geo_route_finder < 1.3.0`.
            
            **Регион:** ${{ github.event.inputs.region_id }}
            **Bbox:** `${{ github.event.inputs.bbox }}`
            **Профиль:** ${{ github.event.inputs.profile }}
            **Формат:** geo_route_finder v1.3.0 / graph format v$kGraphFormatVersion
          files: |
            ${{ github.event.inputs.region_id }}_routing_${{ github.event.inputs.profile }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
