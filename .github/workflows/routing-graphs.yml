name: Build Routing Graph (Russia Full)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль маршрутизации'
        default: 'car'
        type: choice
        options:
          - car
          - bicycle
          - motorcycle
      hf_repo:
        description: 'HuggingFace dataset repo (username/repo-name)'
        default: 'Gitnbghb/routing-graphs'
        type: string

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # ═══ 1. Установка osmium-tool ═══
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      # ═══ 2. Установка Dart SDK ═══
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # ═══ 3. Установка HuggingFace CLI ═══
      - name: Install HuggingFace CLI
        run: pip install "huggingface_hub==0.25.2"

      # ═══ 4. Скачиваем полный PBF России (~2.5 ГБ) ═══
      - name: Download Russia PBF
        run: |
          mkdir -p pbf_data
          echo "📥 Скачиваем russia-latest.osm.pbf (~2.5 ГБ)..."
          curl -L --retry 5 --retry-delay 10 \
            -o pbf_data/russia-latest.osm.pbf \
            "https://download.geofabrik.de/russia-latest.osm.pbf" || \
          curl -L --retry 5 \
            -o pbf_data/russia-latest.osm.pbf \
            "http://download.openstreetmap.fr/extracts/russia-latest.osm.pbf"
          ls -lh pbf_data/

      # ═══ 5. Компиляция графа ВСЕЙ РОССИИ ═══
      - name: Compile routing graph
        run: |
          mkdir -p graph_output scripts
          cat > scripts/compile_graph.dart << 'DART_SCRIPT'
          import 'dart:io';
          import 'package:geo_route_finder/geo_route_finder.dart';
          
          Future<void> main(List<String> args) async {
            final pbfPath = args[0];
            final regionId = args[1];
            final profileName = args[2];
            final outDir = args[3];
            
            final profile = switch (profileName) {
              'bicycle' => VehicleProfile.bicycle,
              'motorcycle' => VehicleProfile.motorcycle,
              _ => VehicleProfile.car,
            };
            
            print('🔧 Компиляция ВСЕЙ РОССИИ: $pbfPath → $outDir ($regionId, $profileName)');
            print('📊 Файл PBF: ${(await File(pbfPath).length() / 1024 / 1024).toStringAsFixed(0)} МБ');
            
            final storage = LocalFileStorage(directory: outDir);
            final converter = OsmConverter(
              profile: profile,
              compress: true,
            );
            
            final sw = Stopwatch()..start();
            await converter.convert(
              inputFile: pbfPath,
              storage: storage,
              graphId: regionId,
            );
            sw.stop();
            print('✅ Граф скомпилирован за ${sw.elapsed.inSeconds} сек (${sw.elapsed.inMinutes} мин)');
            
            for (final ext in ['.graph', '.index', '.meta']) {
              final f = File('$outDir/$regionId$ext');
              if (await f.exists()) {
                final size = await f.length();
                print('   📄 $regionId$ext: ${(size / 1024 / 1024).toStringAsFixed(2)} MB');
              }
            }
          }
          DART_SCRIPT
          
          cd scripts
          cat > pubspec.yaml << 'PUBSPEC'
          name: graph_compiler
          environment:
            sdk: ^3.5.0
          dependencies:
            geo_route_finder: ^1.1.0
          PUBSPEC
          
          dart pub get
          dart run compile_graph.dart \
            ../pbf_data/russia-latest.osm.pbf \
            russia \
            ${{ github.event.inputs.profile }} \
            ../graph_output

      # ═══ 6. Умная упаковка артефактов ═══
      - name: Package artifacts
        run: |
          echo "🔍 Структура graph_output:"
          ls -lhR graph_output/
          
          cd graph_output
          FILES=$(find . -type f \( -name "*.graph" -o -name "*.index" -o -name "*.meta" \))
          echo "Найдены файлы: $FILES"
          
          if [ -z "$FILES" ]; then
            echo "❌ ОШИБКА: Файлы графа не найдены!"
            exit 1
          fi
          
          ARCHIVE="russia_routing_${{ github.event.inputs.profile }}.tar.gz"
          tar -czvf "../$ARCHIVE" $FILES
          cd ..
          
          ls -lh *.tar.gz
          echo "ARCHIVE_NAME=$ARCHIVE" >> $GITHUB_ENV

      # ═══ 7. Расчёт SHA256 checksum ═══
      - name: Generate checksum
        run: |
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"
          echo "CHECKSUM=$(cut -d' ' -f1 ${ARCHIVE_NAME}.sha256)" >> $GITHUB_ENV

      # ═══ 8. 🆕 ЗАГРУЗКА В HUGGINGFACE DATASET ═══
      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_ROUTING }}
        run: |
          echo "🔑 Проверяем авторизацию..."
          huggingface-cli whoami
          
          echo "📤 Загружаем $ARCHIVE_NAME на HuggingFace..."
          huggingface-cli upload ${{ github.event.inputs.hf_repo }} \
            "$ARCHIVE_NAME" "$ARCHIVE_NAME" \
            --repo-type=dataset \
            --revision=main \
            --commit-message="Update $ARCHIVE_NAME ($(date -u +%Y-%m-%d))"
          
          echo "📤 Загружаем checksum..."
          huggingface-cli upload ${{ github.event.inputs.hf_repo }} \
            "${ARCHIVE_NAME}.sha256" "${ARCHIVE_NAME}.sha256" \
            --repo-type=dataset \
            --revision=main \
            --commit-message="Update checksum"
          
          echo "✅ Загружено на HuggingFace"

      # ═══ 9. Генерация index.json (для приложения) ═══
      - name: Generate routing index.json
        run: |
          HF_REPO="${{ github.event.inputs.hf_repo }}"
          BASE_URL="https://huggingface.co/datasets/$HF_REPO/resolve/main"
          
          cat > index.json <<EOF
          {
            "version": 1,
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "$BASE_URL",
            "graphs": [
              {
                "regionId": "russia",
                "profile": "${{ github.event.inputs.profile }}",
                "description": "Россия (полная территория)",
                "archive": "$BASE_URL/${ARCHIVE_NAME}",
                "checksum": "$BASE_URL/${ARCHIVE_NAME}.sha256",
                "sha256": "$CHECKSUM"
              }
            ]
          }
          EOF
          cat index.json

      # ═══ 10. Загрузка index.json ═══
      - name: Upload index.json to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_ROUTING }}
        run: |
          huggingface-cli upload ${{ github.event.inputs.hf_repo }} index.json index.json \
            --repo-type=dataset \
            --revision=main \
            --commit-message="Update routing index.json"

      # ═══ 11. Публикация в GitHub Release (информационно) ═══
      - name: Publish info to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: routing-graphs-hf-v1
          name: "Routing Graphs (HuggingFace mirror)"
          body: |
            Скомпилированный граф дорог **всей России** для офлайн-навигации.
            
            ### 📥 Основное хранилище: HuggingFace
            - **Все файлы**: https://huggingface.co/datasets/${{ github.event.inputs.hf_repo }}/tree/main
            - **Прямая ссылка на архив**: https://huggingface.co/datasets/${{ github.event.inputs.hf_repo }}/resolve/main/${{ env.ARCHIVE_NAME }}
            - **Index (для приложения)**: https://huggingface.co/datasets/${{ github.event.inputs.hf_repo }}/resolve/main/index.json
            
            ### 📊 Информация о сборке
            - **Регион:** Россия (полная территория)
            - **Профиль:** ${{ github.event.inputs.profile }}
            - **Формат:** geo_route_finder v1.1.0
            - **SHA256:** `${{ env.CHECKSUM }}`
            
            > ⚠️ Физический файл больше не хранится в GitHub Releases (лимит 2 GB). 
            > Используйте ссылку на HuggingFace выше.
          files: index.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
