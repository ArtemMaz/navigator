name: Build Routing Graphs (Russia × 4)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль маршрутизации'
        required: true
        default: 'car'
        type: choice
        options:
          - car
          - bicycle
          - motorcycle
      tag:
        description: 'Тег релиза (например: routing-graphs-v2)'
        required: true
        default: 'routing-graphs-v2'
        type: string

jobs:
  # ══════════════════════════════════════════════════════
  #  ФАЗА 1: Скачиваем PBF России (один раз, кэшируем)
  # ══════════════════════════════════════════════════════
  download-pbf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      pbf-size: ${{ steps.download.outputs.size }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      # Кэшируем скачанный PBF (3.5 ГБ)
      - name: Cache Russia PBF
        uses: actions/cache@v4
        id: cache-pbf
        with:
          path: russia-latest.osm.pbf
          key: russia-pbf-${{ hashFiles('**/pbf-url.txt') }}
          restore-keys: russia-pbf-

      - name: Get PBF download URL
        id: url
        run: |
          # Geofabrik Russia — обновляется ежедневно
          echo "url=https://download.geofabrik.de/russia-latest.osm.pbf" >> $GITHUB_OUTPUT
          echo "https://download.geofabrik.de/russia-latest.osm.pbf" > pbf-url.txt

      - name: Download Russia PBF
        if: steps.cache-pbf.outputs.cache-hit != 'true'
        run: |
          echo "📥 Скачиваем Russia PBF (~3.5 ГБ)..."
          curl -L -o russia-latest.osm.pbf --progress-bar \
            "${{ steps.url.outputs.url }}"
          ls -lh russia-latest.osm.pbf

      - name: Verify PBF
        id: download
        run: |
          SIZE=$(stat -c%s russia-latest.osm.pbf)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "✅ PBF готов: $(ls -lh russia-latest.osm.pbf | awk '{print $5}')"
          osmium fileinfo russia-latest.osm.pbf

      # Извлекаем 4 региона через osmium
      - name: Extract 4 regions
        run: |
          mkdir -p extracts

          echo "✂️  Извлечение: russia_west..."
          osmium extract -b 19.0,41.0,46.0,62.0 \
            russia-latest.osm.pbf \
            -o extracts/russia_west.osm.pbf \
            --overwrite

          echo "✂️  Извлечение: russia_ural..."
          osmium extract -b 44.0,44.0,68.0,64.0 \
            russia-latest.osm.pbf \
            -o extracts/russia_ural.osm.pbf \
            --overwrite

          echo "✂️  Извлечение: russia_siberia..."
          osmium extract -b 66.0,44.0,115.0,74.0 \
            russia-latest.osm.pbf \
            -o extracts/russia_siberia.osm.pbf \
            --overwrite

          echo "✂️  Извлечение: russia_east..."
          osmium extract -b 110.0,40.0,180.0,75.0 \
            russia-latest.osm.pbf \
            -o extracts/russia_east.osm.pbf \
            --overwrite

          echo ""
          echo "📦 Размеры экстрактов:"
          ls -lh extracts/

      - name: Upload extracts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbf-extracts
          path: extracts/
          retention-days: 1

  # ══════════════════════════════════════════════════════
  #  ФАЗА 2: Сборка графов (параллельно для 4 регионов)
  # ══════════════════════════════════════════════════════
  build-graph:
    needs: download-pbf
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        region:
          - id: russia_west
            desc: "Запад: Москва, СПб, Калининград, Ростов"
          - id: russia_ural
            desc: "Урал: Казань, Пермь, Екатеринбург, Челябинск"
          - id: russia_siberia
            desc: "Сибирь: Новосибирск, Красноярск, Иркутск"
          - id: russia_east
            desc: "Дальний Восток: Владивосток, Хабаровск, Якутск"
    steps:
      - uses: actions/checkout@v4

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download PBF extracts
        uses: actions/download-artifact@v4
        with:
          name: pbf-extracts
          path: extracts/

      - name: Verify extract
        run: |
          echo "📦 Регион: ${{ matrix.region.id }}"
          echo "📝 ${{ matrix.region.desc }}"
          ls -lh extracts/${{ matrix.region.id }}.osm.pbf

      - name: Install Dart dependencies
        working-directory: tools
        run: dart pub get

      - name: Build routing graph
        working-directory: tools
        run: |
          echo "🔨 Сборка графа: ${{ matrix.region.id }} (${{ github.event.inputs.profile }})"
          dart run build_graph.dart \
            --input ../extracts/${{ matrix.region.id }}.osm.pbf \
            --graph-id ${{ matrix.region.id }} \
            --profile ${{ github.event.inputs.profile }} \
            --output ../output

      - name: Verify output files
        run: |
          echo "📄 Результат:"
          ls -lh output/
          for ext in graph index meta; do
            FILE="output/${{ matrix.region.id }}.$ext"
            if [ -f "$FILE" ]; then
              SIZE=$(du -h "$FILE" | awk '{print $1}')
              echo "  ✅ ${{ matrix.region.id }}.$ext — $SIZE"
            else
              echo "  ❌ ${{ matrix.region.id }}.$ext НЕ НАЙДЕН!"
              exit 1
            fi
          done

      - name: Package as tar.gz
        run: |
          ARCHIVE="${{ matrix.region.id }}_routing_${{ github.event.inputs.profile }}.tar.gz"
          echo "📦 Упаковка: $ARCHIVE"
          cd output
          tar -czvf "../$ARCHIVE" \
            ${{ matrix.region.id }}.graph \
            ${{ matrix.region.id }}.index \
            ${{ matrix.region.id }}.meta
          cd ..
          ls -lh "$ARCHIVE"

      - name: Upload graph archive
        uses: actions/upload-artifact@v4
        with:
          name: graph-${{ matrix.region.id }}
          path: ${{ matrix.region.id }}_routing_${{ github.event.inputs.profile }}.tar.gz
          retention-days: 1

  # ══════════════════════════════════════════════════════
  #  ФАЗА 3: Публикация в GitHub Release
  # ══════════════════════════════════════════════════════
  publish:
    needs: build-graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all graph archives
        uses: actions/download-artifact@v4
        with:
          pattern: graph-*
          merge-multiple: true
          path: archives/

      - name: List archives
        run: |
          echo "📦 Архивы для публикации:"
          ls -lh archives/

      - name: Generate checksums
        run: |
          cd archives
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Графы дорог России (${{ github.event.inputs.tag }})"
          body: |
            ## 🚗 Офлайн-графы дорог для навигации

            **Профиль:** `${{ github.event.inputs.profile }}`
            **Источник:** OpenStreetMap (Geofabrik, ${{ github.run_id }})
            **Сборка:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 🗺️ 4 региона России

            | Файл | Регион | Города |
            |------|--------|--------|
            | `russia_west_routing_${{ github.event.inputs.profile }}.tar.gz` | Запад | Москва, СПб, Калининград, Ростов, Воронеж, Волгоград |
            | `russia_ural_routing_${{ github.event.inputs.profile }}.tar.gz` | Урал | Казань, Пермь, Екатеринбург, Челябинск, Уфа, Самара |
            | `russia_siberia_routing_${{ github.event.inputs.profile }}.tar.gz` | Сибирь | Новосибирск, Красноярск, Иркутск, Омск, Томск |
            | `russia_east_routing_${{ github.event.inputs.profile }}.tar.gz` | Дальний Восток | Владивосток, Хабаровск, Якутск, Магадан, Камчатка |

            ### 📥 Использование в приложении

            Графы скачиваются автоматически при выборе маршрута.
            Базовый URL: `${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/`

            ### 📦 Формат архива

            Каждый `.tar.gz` содержит 3 файла:
            - `{region}.graph` — CSR-массивы графа
            - `{region}.index` — KD-дерево для поиска ближайших узлов
            - `{region}.meta` — JSON-метаданные с контрольными суммами
          files: |
            archives/*.tar.gz
            archives/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
