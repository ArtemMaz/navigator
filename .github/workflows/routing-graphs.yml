name: Build Routing Graphs (Russia 4 parts)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль маршрутизации'
        default: 'car'
        type: choice
        options:
          - car
          - bicycle
          - motorcycle

jobs:
  # ═══ ЭТАП 1: Скачиваем PBF ОДИН раз ═══
  download-pbf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download Russia PBF
        run: |
          mkdir -p pbf_data
          echo "📥 Скачиваем russia-latest.osm.pbf..."
          curl -L --retry 5 --retry-delay 10 \
            -o pbf_data/russia-latest.osm.pbf \
            "https://download.geofabrik.de/russia-latest.osm.pbf" || \
          curl -L --retry 5 \
            -o pbf_data/russia-latest.osm.pbf \
            "http://download.openstreetmap.fr/extracts/russia-latest.osm.pbf"
          ls -lh pbf_data/

      - name: Upload PBF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: russia-pbf
          path: pbf_data/russia-latest.osm.pbf
          retention-days: 1

  # ═══ ЭТАП 2: Параллельная сборка 4-х регионов ═══
  build-graphs:
    needs: download-pbf
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        region:
          - id: russia_west_europe
            name: "Европейская часть"
            bbox: "19,40,62,82"
          - id: russia_ural_siberia
            name: "Урал и Зап. Сибирь"
            bbox: "59,40,97,82"
          - id: russia_east_siberia
            name: "Восточная Сибирь"
            bbox: "94,40,137,82"
          - id: russia_far_east
            name: "Дальний Восток"
            bbox: "134,40,180,82"

    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download PBF artifact
        uses: actions/download-artifact@v4
        with:
          name: russia-pbf
          path: pbf_data

      - name: Extract bbox
        run: |
          mkdir -p extracts
          osmium extract \
            --bbox=${{ matrix.region.bbox }} \
            --overwrite \
            -o extracts/${{ matrix.region.id }}.osm.pbf \
            pbf_data/russia-latest.osm.pbf
          ls -lh extracts/
          echo "✅ Готов: extracts/${{ matrix.region.id }}.osm.pbf"

      - name: Compile routing graph
        run: |
          mkdir -p graph_output scripts
          cat > scripts/compile_graph.dart << 'DART_SCRIPT'
          import 'dart:io';
          import 'package:geo_route_finder/geo_route_finder.dart';

          Future<void> main(List<String> args) async {
            final pbfPath = args[0];
            final regionId = args[1];
            final profileName = args[2];
            final outDir = args[3];

            final profile = switch (profileName) {
              'bicycle' => VehicleProfile.bicycle,
              'motorcycle' => VehicleProfile.motorcycle,
              _ => VehicleProfile.car,
            };

            print('🔧 Компиляция: $pbfPath → $outDir ($regionId, $profileName)');
            final pbfSize = (await File(pbfPath).length() / 1024 / 1024).toStringAsFixed(0);
            print('📊 Файл PBF: $pbfSize МБ');

            final storage = LocalFileStorage(directory: outDir);
            final converter = OsmConverter(
              profile: profile,
              compress: true,
            );

            final sw = Stopwatch()..start();
            await converter.convert(
              inputFile: pbfPath,
              storage: storage,
              graphId: regionId,
            );
            sw.stop();
            print('✅ Граф готов за ${sw.elapsed.inMinutes} мин');

            for (final ext in ['.graph', '.index', '.meta']) {
              final f = File('$outDir/$regionId$ext');
              if (await f.exists()) {
                final size = await f.length();
                print('   📄 $regionId$ext: ${(size / 1024 / 1024).toStringAsFixed(2)} MB');
              }
            }
          }
          DART_SCRIPT

          cd scripts
          cat > pubspec.yaml << 'PUBSPEC'
          name: graph_compiler
          environment:
            sdk: ^3.5.0
          dependencies:
            geo_route_finder: ^1.1.0
          PUBSPEC

          dart pub get
          dart run compile_graph.dart \
            ../extracts/${{ matrix.region.id }}.osm.pbf \
            ${{ matrix.region.id }} \
            ${{ github.event.inputs.profile }} \
            ../graph_output

      - name: Package artifacts
        run: |
          cd graph_output
          tar -czvf ../${{ matrix.region.id }}_routing_${{ github.event.inputs.profile }}.tar.gz \
            $(find . -name "*.graph" -o -name "*.index" -o -name "*.meta")
          cd ..
          ls -lh *.tar.gz

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-${{ matrix.region.id }}
          path: |
            ${{ matrix.region.id }}_routing_${{ github.event.inputs.profile }}.tar.gz
            extracts/${{ matrix.region.id }}.osm.pbf
          retention-days: 1

  # ═══ ЭТАП 3: Публикация всех 4-х в один релиз ═══
  publish-release:
    needs: build-graphs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all graph artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: graph-*
          merge-multiple: true
          path: release_files

      - name: List files
        run: ls -lhR release_files/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: routing-graphs-russia-4parts
          name: "Russia Routing Graphs (4 parts)"
          body: |
            🇷🇺 Графы дорог России для офлайн-навигации (4 части с перекрытиями ~3°)
            
            - `russia_west_europe` — Европейская часть (19°E–62°E)
            - `russia_ural_siberia` — Урал + Зап. Сибирь (59°E–97°E)
            - `russia_east_siberia` — Восточная Сибирь (94°E–137°E)
            - `russia_far_east` — Дальний Восток (134°E–180°E)
            
            **Профиль:** ${{ github.event.inputs.profile }}
          files: |
            release_files/*.tar.gz
            release_files/*.osm.pbf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
