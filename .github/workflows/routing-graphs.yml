name: Build Routing Graphs (Russia 6 regions)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль маршрутизации'
        default: 'car'
        type: choice
        options:
          - car
          - bicycle
          - motorcycle

jobs:
  download-pbf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download Russia PBF
        run: |
          mkdir -p pbf_data
          echo "📥 Скачиваем russia-latest.osm.pbf (≈3.5 GB)..."
          curl -L --retry 5 --retry-delay 10 --max-time 1800 \
            -o pbf_data/russia-latest.osm.pbf \
            "https://download.geofabrik.de/russia-latest.osm.pbf" || \
          curl -L --retry 5 --max-time 1800 \
            -o pbf_data/russia-latest.osm.pbf \
            "http://download.openstreetmap.fr/extracts/russia-latest.osm.pbf"
          ls -lh pbf_data/

      - name: Upload PBF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: russia-pbf
          path: pbf_data/russia-latest.osm.pbf
          retention-days: 1

  build-region:
    needs: download-pbf
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - region_id: russia_west
            bbox: '19,43,45,72'
            description: 'Запад (Калининград, СПб, Москва)'
          - region_id: russia_south
            bbox: '36,43,48,52'
            description: 'Юг (Краснодар, Ростов, Кавказ, Волгоград)'
          - region_id: russia_volga
            bbox: '44,50,60,58'
            description: 'Поволжье (Самара, Казань, Саратов)'
          - region_id: russia_ural
            bbox: '50,50,80,70'
            description: 'Урал (Пермь, Екатеринбург, Челябинск)'
          - region_id: russia_siberia
            bbox: '70,48,115,75'
            description: 'Сибирь (Новосибирск, Красноярск, Иркутск)'
          - region_id: russia_far_east
            bbox: '105,42,180,75'
            description: 'Дальний Восток (Якутск, Хабаровск, Владивосток)'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download shared PBF artifact
        uses: actions/download-artifact@v4
        with:
          name: russia-pbf
          path: pbf_data/

      - name: Verify PBF file
        run: |
          ls -lh pbf_data/
          test -f pbf_data/russia-latest.osm.pbf || (echo "❌ PBF не найден!" && exit 1)

      - name: Extract bbox for ${{ matrix.region_id }}
        run: |
          mkdir -p extracts
          echo "✂️  Режем bbox: ${{ matrix.bbox }}"
          echo "📍 Регион: ${{ matrix.description }}"
          osmium extract \
            --bbox=${{ matrix.bbox }} \
            --overwrite \
            -o extracts/${{ matrix.region_id }}.osm.pbf \
            pbf_data/russia-latest.osm.pbf
          ls -lh extracts/

      # 🆕 ОГРАНИЧЕНИЕ RAM: swap 8 GB для подстраховки
      - name: Create swap space
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          free -h

      - name: Compile routing graph
        run: |
          mkdir -p graph_output scripts
          cat > scripts/compile_graph.dart << 'DART_SCRIPT'
          import 'dart:async';
          import 'dart:io';
          import 'package:geo_route_finder/geo_route_finder.dart';

          Future<void> main(List<String> args) async {
            final pbfPath = args[0];
            final regionId = args[1];
            final profileName = args[2];
            final outDir = args[3];

            final profile = switch (profileName) {
              'bicycle' => VehicleProfile.bicycle,
              'motorcycle' => VehicleProfile.motorcycle,
              _ => VehicleProfile.car,
            };

            print('🔧 Компиляция: $pbfPath → $outDir ($regionId, $profileName)');
            print('📦 geo_route_finder версия: $geoRouteFinderVersion');
            print('📐 Формат графа: v$kGraphFormatVersion');

            final storage = LocalFileStorage(directory: outDir);
            // 🆕 readSignals и readTurnRestrictions включены — нужны для качества маршрутов
            final converter = OsmConverter(
              profile: profile,
              compress: true,
              readSignals: true,
              readTurnRestrictions: true,
            );

            final sw = Stopwatch()..start();
            final timer = Timer.periodic(const Duration(minutes: 3), (t) {
              print('⏰ Идёт ${sw.elapsed.inMinutes} мин...');
            });

            try {
              await converter.convert(
                inputFile: pbfPath,
                storage: storage,
                graphId: regionId,
              );
            } finally {
              timer.cancel();
            }
            sw.stop();
            print('✅ Граф скомпилирован за ${sw.elapsed.inMinutes} мин ${sw.elapsed.inSeconds % 60} сек');

            final stats = converter.lastRestrictionStats;
            if (stats != null) {
              print('📋 Turn restrictions: $stats');
            }

            for (final ext in ['.graph', '.index', '.meta']) {
              final f = File('$outDir/${regionId}_$profileName$ext');
              if (await f.exists()) {
                final size = await f.length();
                print('   📄 ${regionId}_$profileName$ext: ${(size / 1024 / 1024).toStringAsFixed(2)} MB');
              }
            }
          }
          DART_SCRIPT

          cd scripts
          cat > pubspec.yaml << 'PUBSPEC'
          name: graph_compiler
          environment:
            sdk: ^3.5.0
          dependencies:
            geo_route_finder: ^1.3.0
          PUBSPEC
          dart pub get
          dart run compile_graph.dart \
            ../extracts/${{ matrix.region_id }}.osm.pbf \
            ${{ matrix.region_id }} \
            ${{ github.event.inputs.profile }} \
            ../graph_output

      - name: Package artifacts
        run: |
          echo "🔍 Структура graph_output:"
          find graph_output -type f | sort
          cd graph_output
          tar -czvf ../${{ matrix.region_id }}_routing_${{ github.event.inputs.profile }}.tar.gz \
            $(find . -name "*.graph" -o -name "*.index" -o -name "*.meta")
          cd ..
          ls -lh *.tar.gz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: routing-graphs-v1
          name: "Routing Graphs v1 (geo_route_finder 1.4.0)"
          body: |
            Скомпилированные графы дорог для офлайн-навигации.
            
            **⚠️ ВАЖНО:** Графы собраны с `geo_route_finder 1.4.0` (формат v5).
            
            **Профиль:** ${{ github.event.inputs.profile }}
            **Регион:** ${{ matrix.region_id }}
            **Bbox:** `${{ matrix.bbox }}`
            **Описание:** ${{ matrix.description }}
          files: |
            ${{ matrix.region_id }}_routing_${{ github.event.inputs.profile }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
