name: Build Routing Graphs (Russia × 4)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль маршрутизации'
        default: 'car'
        type: choice
        options:
          - car
          - bicycle
          - motorcycle

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    
    # 🚀 МАТРИЦА: Запускает 4 параллельных джоба для каждого региона
    strategy:
      fail-fast: false
      matrix:
        region:
          - { id: 'russia_west', bbox: '19,41,46,72', desc: 'Запад РФ (Москва, СПб, Юг)' }
          - { id: 'russia_ural', bbox: '44,44,66,72', desc: 'Урал и Поволжье' }
          - { id: 'russia_siberia', bbox: '65,46,106,78', desc: 'Сибирь' }
          - { id: 'russia_east', bbox: '105,41,180,78', desc: 'Дальний Восток' }

    steps:
      - uses: actions/checkout@v4

      # ═══ 1. Установка osmium для вырезания bbox из PBF ═══
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      # ═══ 2. Установка Dart SDK ═══
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # ═══ 3. Скачиваем PBF России (каждый джоб качает свой экземпляр) ═══
      - name: Download Russia PBF
        run: |
          mkdir -p pbf_data
          echo "📥 Скачиваем russia-latest.osm.pbf..."
          curl -L --retry 5 --retry-delay 10 \
            -o pbf_data/russia-latest.osm.pbf \
            "https://download.geofabrik.de/russia-latest.osm.pbf" || \
          curl -L --retry 5 \
            -o pbf_data/russia-latest.osm.pbf \
            "http://download.openstreetmap.fr/extracts/russia-latest.osm.pbf"
          ls -lh pbf_data/

      # ═══ 4. Вырезаем bbox региона из полного PBF ═══
      - name: Extract bbox
        run: |
          mkdir -p extracts
          osmium extract \
            --bbox=${{ matrix.region.bbox }} \
            --overwrite \
            -o extracts/${{ matrix.region.id }}.osm.pbf \
            pbf_data/russia-latest.osm.pbf
          ls -lh extracts/
          echo "✅ Файл extracts/${{ matrix.region.id }}.osm.pbf готов"

      # ═══ 5. Компиляция графа через inline Dart-скрипт (Рабочий вариант) ═══
      - name: Compile routing graph
        run: |
          mkdir -p graph_output scripts
          cat > scripts/compile_graph.dart << 'DART_SCRIPT'
          import 'dart:io';
          import 'package:geo_route_finder/geo_route_finder.dart';
          
          Future<void> main(List<String> args) async {
            final pbfPath = args[0];
            final regionId = args[1];
            final profileName = args[2];
            final outDir = args[3];
            
            final profile = switch (profileName) {
              'bicycle' => VehicleProfile.bicycle,
              'motorcycle' => VehicleProfile.motorcycle,
              _ => VehicleProfile.car,
            };
            
            print('🔧 Компиляция: $pbfPath → $outDir ($regionId, $profileName)');
            final storage = LocalFileStorage(directory: outDir);
            final converter = OsmConverter(
              profile: profile,
              compress: true,
            );
            
            final sw = Stopwatch()..start();
            await converter.convert(
              inputFile: pbfPath,
              storage: storage,
              graphId: regionId,
            );
            sw.stop();
            print('✅ Граф скомпилирован за ${sw.elapsed.inSeconds} сек');
          }
          DART_SCRIPT
          
          cd scripts
          cat > pubspec.yaml << 'PUBSPEC'
          name: graph_compiler
          environment:
            sdk: ^3.5.0
          dependencies:
            geo_route_finder: ^1.1.0
          PUBSPEC
          
          dart pub get
          dart run compile_graph.dart \
            ../extracts/${{ matrix.region.id }}.osm.pbf \
            ${{ matrix.region.id }} \
            ${{ github.event.inputs.profile }} \
            ../graph_output

      # ═══ 6. Умная упаковка артефактов (учитывает суффикс _car) ═══
      - name: Package artifacts
        run: |
          echo "🔍 Структура graph_output:"
          ls -lhR graph_output/
          
          cd graph_output
          # Ищем все файлы графа (с учетом суффикса профиля, например russia_east_car.graph)
          FILES=$(find . -type f \( -name "*.graph" -o -name "*.index" -o -name "*.meta" \))
          echo "Найдены файлы: $FILES"
          
          if [ -z "$FILES" ]; then
            echo "❌ ОШИБКА: Файлы графа не найдены!"
            exit 1
          fi
          
          tar -czvf ../${{ matrix.region.id }}_routing_${{ github.event.inputs.profile }}.tar.gz $FILES
          cd ..
          ls -lh *.tar.gz

      # ═══ 7. Публикация в GitHub Release ═══
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: routing-graphs-v2
          name: "Routing Graphs v2 (Russia x4)"
          body: |
            Скомпилированные графы дорог для офлайн-навигации.
            **Регион:** ${{ matrix.region.desc }} (`${{ matrix.region.id }}`)
            **Bbox:** `${{ matrix.region.bbox }}`
            **Профиль:** ${{ github.event.inputs.profile }}
            **Формат:** geo_route_finder v1.1.0
          files: |
            ${{ matrix.region.id }}_routing_${{ github.event.inputs.profile }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
